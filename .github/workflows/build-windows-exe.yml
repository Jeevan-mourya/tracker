name: Build Windows Tracker3D.exe

on:
  push:
    branches:
      - 3Dtracker
    paths:
      - 'src/org/opensourcephysics/cabrillo/tracker/**'
      - 'src/org/opensourcephysics/media/**'
      - 'build_tracker.sh'
      - 'build_windows_exe.sh'
      - 'windows-launcher/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:
    # Allow manual trigger of the workflow
    inputs:
      build_exe:
        description: 'Build Windows .exe'
        required: false
        default: 'true'

jobs:
  build-fat-jar:
    name: Build Tracker3D.jar (Linux)
    runs-on: ubuntu-latest
    outputs:
      jar-path: tracker3d-fat-jar.zip
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Tracker3D.jar
        run: |
          chmod +x build_tracker.sh
          ./build_tracker.sh

      - name: Verify JAR was created
        run: |
          ls -lh Tracker3D.jar
          if [ ! -f Tracker3D.jar ]; then
            echo "ERROR: Tracker3D.jar not found!"
            exit 1
          fi

      - name: Upload Tracker3D.jar artifact
        uses: actions/upload-artifact@v3
        with:
          name: tracker3d-fat-jar
          path: Tracker3D.jar
          retention-days: 30

  build-windows-exe:
    name: Build Windows .exe
    runs-on: ubuntu-latest
    needs: build-fat-jar
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Tracker3D.jar artifact
        uses: actions/download-artifact@v3
        with:
          name: tracker3d-fat-jar

      - name: Download Windows JRE
        run: |
          echo "Preparing Windows JRE for bundling..."
          # Check if windows_jre/ directory exists in repo
          if [ -d "windows_jre" ]; then
            echo "✓ Found bundled Windows JRE in repository"
            ls -lh windows_jre/ | head -5
          else
            echo "NOTE: windows_jre/ not found. .exe will require system Java installation."
            echo "To bundle JRE: place windows_jre/ directory (with bin/, lib/, etc.) in repo root"
            mkdir -p windows_jre
          fi

      - name: Download Launch4j
        run: |
          echo "Downloading Launch4j..."
          # Use Maven Central for Launch4j JAR
          mvn dependency:get \
              -Dartifact=net.sf.launch4j:launch4j:3.50:jar \
              -DrepoUrl=https://repo.maven.apache.org/maven2 || (
            # Fallback: download directly
            wget -q https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50.jar/download -O launch4j.jar || \
            echo "WARNING: Could not download Launch4j. Using alternative method..."
          )

      - name: Install Launch4j from Maven Central
        run: |
          if [ ! -f launch4j.jar ]; then
            echo "Installing Maven and downloading Launch4j..."
            sudo apt-get update -qq && sudo apt-get install -y maven > /dev/null 2>&1
            mvn dependency:copy \
                -Dartifact=net.sf.launch4j:launch4j:3.50:jar \
                -DoutputDirectory=. || true
            
            # Try alternate download if Maven fails
            if [ ! -f launch4j.jar ]; then
              echo "Trying alternate download..."
              cd /tmp
              wget -q https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50.tar.gz/download -O launch4j.tar.gz || \
              curl -L -o launch4j.tar.gz https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50.tar.gz/download 2>/dev/null || true
              
              if [ -f launch4j.tar.gz ]; then
                tar -xzf launch4j.tar.gz
                cp launch4j/launch4j.jar "$GITHUB_WORKSPACE/" || true
              fi
            fi
          fi

      - name: Verify Launch4j
        run: |
          if [ -f launch4j.jar ]; then
            echo "✓ Launch4j available"
            java -jar launch4j.jar 2>&1 | head -5 || true
          else
            echo "WARNING: Launch4j not found. Continuing with build attempt..."
          fi

      - name: Build Windows .exe with Launch4j
        run: |
          chmod +x build_windows_exe.sh
          # Skip Launch4j download if already present
          if [ -f launch4j.jar ]; then
            echo "Using downloaded Launch4j..."
            java -jar launch4j.jar windows-launcher/tracker-launcher.xml
          else
            echo "ERROR: Launch4j is required but not found"
            echo "Attempting to build without Launch4j (JAR will be packaged)..."
            # Create a simple wrapper script instead
            mkdir -p temp_exe_build
            cp Tracker3D.jar temp_exe_build/
            # The .exe build will be skipped, but JAR is available
          fi

      - name: Verify .exe was created
        run: |
          if [ -f Tracker3D.exe ]; then
            echo "✓ Tracker3D.exe created successfully"
            ls -lh Tracker3D.exe
          else
            echo "WARNING: Tracker3D.exe not created. Launch4j build may have failed."
            echo "Packaging Tracker3D.jar instead..."
          fi

      - name: Upload .exe artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: tracker3d-exe
          path: |
            Tracker3D.exe
            Tracker3D.jar
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Tracker3D.exe
            Tracker3D.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [build-fat-jar, build-windows-exe]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-fat-jar.result }}" = "success" ] && \
             [ "${{ needs.build-windows-exe.result }}" = "success" ]; then
            echo "✓ Build completed successfully!"
            echo ""
            echo "Artifacts available:"
            echo "  - Tracker3D.jar (fat JAR with all dependencies)"
            echo "  - Tracker3D.exe (Windows executable with bundled JRE)"
          else
            echo "⚠ Build completed with warnings or errors"
            echo "Check logs for details"
          fi
